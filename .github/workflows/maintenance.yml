name: Ekip günlük bakım

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ekip-daily-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'birlikteiyilik/birlikte-iyilik-ekip' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Kısa ömürlü kimlikle günlük bakım
        run: node scripts/run-maintenance.mjs
