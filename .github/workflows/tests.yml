name: Ekip testleri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekip-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Paketleri kur
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Yüksek ve kritik paket açıkları
        run: corepack pnpm security:audit
      - name: Model ve yedek testleri
        run: corepack pnpm test
      - name: Auth ve PostgreSQL API testleri
        run: corepack pnpm test:api
      - name: Üretim build
        run: corepack pnpm build
