name: Ekip testleri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekip-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Paketleri kur
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Model ve yedek testleri
        run: corepack pnpm test
      - name: Auth ve PostgreSQL API testleri
        run: corepack pnpm test:api
      - name: Üretim build
        run: corepack pnpm build

  deploy:
    name: Şirket Vercel hesabında canlı yayın
    needs: verify
    if: github.repository == 'birlikteiyilik/birlikte-iyilik-ekip' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Yayın CLI aracını kur
        run: npm install --global vercel@63.1.2
      - name: Test edilmiş kaynağı şirket hesabıyla yayınla
        run: node scripts/deploy-production.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Başarılı yayını kaydet
        if: success()
        run: |
          echo 'Test edilen commit şirket Vercel hesabında yayınlandı.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canlı adres: https://ekip.birlikteiyilik.com' >> "$GITHUB_STEP_SUMMARY"
